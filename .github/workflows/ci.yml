name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate SQL migrations
        run: pnpm validate:migrations

      - name: Validate PWA shell/security boundary
        run: pnpm validate:pwa

      - name: Validate legacy workbook extractor
        run: python3 scripts/validate-workbook-extractor.py

      - name: Validate P2 Excel parity
        run: pnpm validate:p2-parity

      - name: Validate P3 operational calendar
        run: pnpm validate:p3-calendar

      - name: Validate P4 offline foundation
        run: pnpm validate:p4-offline

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
