<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="FieldRep OS — Field Force Planning & Intelligence" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FieldRep" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/app-icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/app-icon-192.png" />
    <script>
      try {
        const storedTheme = localStorage.getItem('fieldrep-theme')
        document.documentElement.dataset.theme = storedTheme === 'light' ? 'light' : 'dark'
      } catch (_) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <title>FieldRep OS</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>برای اجرای FieldRep OS جاوااسکریپت باید فعال باشد.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
